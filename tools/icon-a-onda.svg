<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aBg" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#252c3c"/>
      <stop offset=".55" stop-color="#141922"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="aBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffd07a"/>
    </linearGradient>
    <radialGradient id="aGlow" cx=".5" cy=".56" r=".52">
      <stop offset="0" stop-color="#ffab3d" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffab3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#aBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#aGlow)"/>

  <!-- Onda asimétrica: un ritmo irregular lee como audio real, no como
       un ecualizador genérico, y aguanta bien a 24 px. -->
  <g fill="url(#aBar)">
    <rect x="11"   y="28.5" width="5" height="7"   rx="2.5"/>
    <rect x="18.5" y="22"   width="5" height="20"  rx="2.5"/>
    <rect x="26"   y="13"   width="5" height="38"  rx="2.5"/>
    <rect x="33.5" y="18.5" width="5" height="27"  rx="2.5"/>
    <rect x="41"   y="9.5"  width="5" height="45"  rx="2.5"/>
    <rect x="48.5" y="24"   width="5" height="16"  rx="2.5"/>
  </g>

  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#aEdge)"/>
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="14.25"
        fill="none" stroke="#4a5568" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
